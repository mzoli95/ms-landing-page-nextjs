<!doctype html>
<html lang="hu">
  <meta charset="utf-8" />
  <title>Molnár Systems — social card source, 1200 × 630</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #080f20;
      color: #f5f8ff;
      font-family: Arial, sans-serif;
      padding: 42px 56px;
      background-image: radial-gradient(
        ellipse at 100% 0%,
        #153d54,
        transparent 65%
      );
    }
    header {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 36px;
      font-weight: 700;
    }
    header img {
      width: 116px;
      height: auto;
    }
    header span {
      border-left: 1px solid #3c536a;
      padding-left: 24px;
    }
    h1 {
      margin: 40px 0 12px;
      font-size: 76px;
      line-height: 1.1;
      letter-spacing: -2px;
    }
    .services {
      font-size: 34px;
      line-height: 1.5;
      color: #e0eafa;
      margin: 0;
    }
    .hardware {
      border-top: 1px solid #38526c;
      padding-top: 26px;
      margin: 28px 0 8px;
      font-size: 58px;
      line-height: 1.15;
      letter-spacing: -1px;
      color: #94dfff;
    }
    footer {
      position: absolute;
      bottom: 40px;
      left: 56px;
      right: 56px;
      border-top: 1px solid #324259;
      padding-top: 22px;
      display: flex;
      justify-content: space-between;
      font-size: 28px;
      color: #adc3db;
    }
    footer strong {
      color: #f5f8ff;
    }
  </style>
  <header>
    <img src="../public/ms_logo.png" alt="" /><span>Molnár Systems</span>
  </header>
  <h1 id="headline">Weboldal. Saját program.</h1>
  <p class="services" id="services">
    Számítógépre is · Excel-feladatok · Kimutatások
  </p>
  <h2 class="hardware" id="hardware">PC-javítás és gyorsítás</h2>
  <p class="services" id="hardware-details">
    Gépépítés · Bővítés · Segítség távolról is
  </p>
  <footer>
    <span id="area">Siófok környékén · Online országosan</span
    ><strong>molnarsystems.hu</strong>
  </footer>
  <script>
    if (new URLSearchParams(location.search).get("lang") === "en") {
      document.documentElement.lang = "en";
      document.querySelector("#headline").textContent =
        "Websites. Custom apps.";
      document.querySelector("#services").textContent =
        "Desktop apps too · Excel tasks · Reports";
      document.querySelector("#hardware").textContent =
        "PC repairs and speed-ups";
      document.querySelector("#hardware-details").textContent =
        "PC builds · Upgrades · Remote help too";
      document.querySelector("#area").textContent =
        "Siófok area · Online across Hungary";
    }
  </script>
</html>
